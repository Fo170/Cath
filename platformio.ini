; Fichier exemple platformio.ini pour utiliser la librairie Cath
; Copiez ce fichier dans le dossier de votre projet PlatformIO

; Pour ESP8266, utilisez :
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/Fo170/Cath.git@^1.0.0

; Pour ESP32, utilisez :
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/Fo170/Cath.git@^1.0.0
